[project]
name = "auth-service"
version = "0.1.0"
description = "Accounts, passwords, and the JWTs the other services trust"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
]

# The service is a plain package directory, not something to build or publish;
# uv only needs it for its lockfile.
[tool.uv]
package = false
