[project]
name = "domain-service"
version = "0.1.0"
description = "Patients, providers, slots, appointments, calls, and the clinic FAQ corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "httpx>=0.27",
]

# The service is a plain package directory, not something to build or publish;
# uv only needs it for its lockfile.
[tool.uv]
package = false
