services:
  gateway:
    ports:
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    volumes:
      - ./gateway/nginx-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
