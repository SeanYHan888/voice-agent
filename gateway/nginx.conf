map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # LetsEncrypt's HTTP-01 challenge. The directory is empty during normal local use.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Service routes — prefix stripped before proxying
    location /api/auth/ {
        proxy_pass http://auth:8000/;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/domain/ {
        proxy_pass http://domain:8000/;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/agent/ {
        proxy_pass http://agent:8000/;
        include /etc/nginx/proxy_common.conf;
        # voice widget streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Everything else: React app
    location / {
        proxy_pass http://frontend:80/;
        include /etc/nginx/proxy_common.conf;
    }
}
