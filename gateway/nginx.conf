map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Re-resolve service names through Docker's DNS instead of pinning the IPs nginx saw
    # at boot. `docker compose up` recreates a service on a new IP, and a gateway holding
    # the old one would quietly proxy /api/domain to whichever container inherited it.
    # Variables in proxy_pass are what make nginx consult the resolver per request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth     http://auth:8000;
    set $domain   http://domain:8000;
    set $agent    http://agent:8000;
    set $frontend http://frontend:80;

    # LetsEncrypt's HTTP-01 challenge. The directory is empty during normal local use.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Service routes — prefix stripped before proxying
    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/domain/ {
        rewrite ^/api/domain/(.*)$ /$1 break;
        proxy_pass $domain;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/agent/ {
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass $agent;
        include /etc/nginx/proxy_common.conf;
        # voice widget streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # Everything else: React app
    location / {
        proxy_pass $frontend;
        include /etc/nginx/proxy_common.conf;
    }
}
