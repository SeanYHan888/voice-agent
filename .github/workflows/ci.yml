name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build # tsc -b && vite build
        working-directory: frontend

  agent-tests:
    name: Agent pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # uv from PyPI rather than astral-sh/setup-uv: the action fetches its release list
      # from the GitHub API, which is one more thing that can be down.
      - run: pip install "uv==0.12.*"
      # Offline: the domain service and the model are faked in tests/conftest.py, so this
      # covers session identity, the ElevenLabs adapter, tools, guardrails and the graph
      # loop without keys or containers.
      - run: uv sync --locked
        working-directory: services/agent
      - run: uv run --frozen pytest -q
        working-directory: services/agent

  deploy:
    name: Deploy to EC2
    needs: [frontend, agent-tests]
    # Dormant until the repo variable DEPLOY_ENABLED is set to 'true'
    # (Settings → Secrets and variables → Actions → Variables).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - name: Check secrets are present
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Never print the key; a checksum and line count are enough to tell an empty
          # or truncated secret from a healthy one.
          echo "host set: $([ -n "$EC2_HOST" ] && echo yes || echo NO)"
          echo "key lines: $(printf '%s' "$EC2_SSH_KEY" | wc -l), sha256: $(printf '%s' "$EC2_SSH_KEY" | sha256sum | cut -c1-12)"
          [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]

      # SSH on the box is restricted to a single home IP. Rather than open port 22 to the
      # world, the runner opens a hole for its own address, deploys, and closes it again —
      # the IAM user behind these credentials can do nothing except toggle that one rule.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open SSH for this runner
        id: sg
        env:
          SG_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32,Description=github-actions-deploy}]" \
            --output text >/dev/null
          echo "opened 22 for $RUNNER_IP"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            # ssh-action v1 dropped `script_stop`; `set -e` is its documented replacement,
            # so a failed fetch or build aborts here instead of running the next line.
            set -e
            cd ~/voice-agent
            git fetch origin main
            git reset --hard origin/main
            # The box runs the HTTPS overlay; deploying without it would drop TLS.
            docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
            docker image prune -f

      - name: Close SSH for this runner
        if: always() && steps.sg.outputs.runner_ip != ''
        env:
          SG_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          RUNNER_IP: ${{ steps.sg.outputs.runner_ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]" \
            --output text >/dev/null
          echo "closed 22 for $RUNNER_IP"

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://$EC2_HOST/api/agent/healthz" >/dev/null \
               && curl -sf "https://$EC2_HOST/api/domain/healthz" >/dev/null \
               && curl -sf "https://$EC2_HOST/api/auth/healthz" >/dev/null; then
              echo "deployed and healthy after ${i} checks"; exit 0
            fi
            sleep 5
          done
          echo "::error::services not healthy after deploy"; exit 1
